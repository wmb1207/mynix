[bar/top]
width = 100%
height = 24
offset-y = 0
background = #222222
foreground = #BEBFB7
border-size = 0

padding-left = 0
padding-right = 0
padding-top = 5
padding-bottom = 5

modules-left = bspwm
modules-center = date
modules-right = memory cpu disk home volume battery wifi
font-0 = DejaVu Sans Mono :pixelsize=14
module-margin = 2

[bar/top-external]
monitor = DP-1
width = 100%
height = 24
offset-y = 0
background = #222222
foreground = #BEBFB7
border-size = 0

padding-left = 0
padding-right = 0
padding-top = 5
padding-bottom = 5

modules-left = bspwm
modules-center = date
modules-right = memory cpu disk home volume battery wifi
font-0 = DejaVu Sans Mono :pixelsize=14
module-margin = 2


[module/date]
type = internal/date
interval = 5
date = %a %b %d
time = %H:%M
label = (sys/date %date% Time: %time%)
label-background = #222222

[module/bspwm]
type = internal/bspwm
enable-click = true
enable-scroll = true
pin-workspaces = true
inline-mode = false
reverse-scroll = false
wrap = false
spacing = 0

label-focused = " %name% "
label-focused-background = #CFB980
label-focused-foreground = #222222

label-occupied = " %name% "
label-occupied-foreground = #BEBFB7

label-urgent = " %name%! "
label-urgent-foreground = #ff0000

label-empty = " %name% "
label-empty-foreground = #555555

enable-empty-desktop = true

[module/memory]
type = custom/script
exec = free -h | awk '/^Mem/ { print "(sys/ram " $3 " / " $2 ")"}'
interval = 2
label = %output%
label-background = #222222
label-foreground = #BEBFB7

[module/cpu]
type = custom/script
exec = top -bn1 | grep "Cpu(s)" | awk '{ print "(sys/cpu: " 100 - $8 "%)" }'
interval = 2
label = %output%
label-background = #222222
label-foreground = #BEBFB7

[module/disk]
type = custom/script
exec = df -h / | awk 'NR==2 { print "(fs/root " $3 " / " $2 ")"}'
interval = 30
label = %output%
label-background = #222222
label-foreground = #BEBFB7

[module/home]
type = custom/script
exec = df -h /home | awk 'NR==2 { print "(fs/home " $3 " / " $2 ")"}'
interval = 30
label = %output%
label-background = #222222
label-foreground = #BEBFB7

[module/volume]
type = internal/pulseaudio
interval = 2
use-ui-max = true
format-volume = <label>
format-muted = <label-muted>
label = Vol: %percentage%%
label-background = #222222
label-muted = Vol: muted
label-muted-foreground = #BEBFB7
label-muted-background = #222222
label-foreground = #BEBFB7

[module/battery]
type = custom/script
exec = acpi -b | awk -F', ' '{print "(sys/battery " $2 ")"}'
interval = 30
label = %output%
label-background = #222222
label-foreground = #BEBFB7

[module/wifi]
type = custom/script
exec = nmcli -t -f active,ssid dev wifi | grep '^yes' | cut -d: -f2 || echo "(net/wireless: dc)"
interval = 30
label = "(net/wireless %output%)"
xlabel-background = #222222
label-foreground = #BEBFB7
