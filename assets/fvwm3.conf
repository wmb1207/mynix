# old fg 99cccc
# new fg 045e53

InfoStoreAdd terminal urxvt

# This is used for "Run Command" and the Meta+Space key-binding.
InfoStoreAdd runcmd "dmenu_run"

# Doric Beach dmenu (sand background, sea selection)
InfoStoreAdd runcmdopt "-i -fn 'DejaVu Sans Mono' \
-nb '#f3efe6' \
-nf '#2e3a3a' \
-sb '#2a8f8a' \
-sf '#f3efe6'"

DesktopConfiguration global

###########
# 1: Functions
###########

# Start Function
DestroyFunc StartFunction
AddToFunc   StartFunction
+ I Test (Init) InitBackground

# --- NO SIDEBAR PANEL ---
# + I Module FvwmButtons RightPanel

# --- Sticky utility windows (Plan 9-ish) ---
+ I Module FvwmIconMan IconManDock
+ I Module FvwmPager   PagerDock
+ I Test (Init) Exec exec xclock -geometry 90x28-8-8 -bg "#f3efe6" -fg "#2e3a3a" &

+ I Module FvwmEvent EventNewDesk
+ I Test (Init) Exec exec dunst --config ~/.config/dunst/dunstrc &

+ I Test (Init) Exec exec xsetroot -cursor_name left_ptr
+ I Test (Init) Exec exec bb ~/.local/bin/battery.clj --daemon &
+ I Test (Init) Exec exec emacs --daemon --eval "(progn (select-frame (make-frame-on-display \":0\")) (make-frame-invisible))" &
+ I Test (Init) Exec exec xrdb -merge ~/.Xresources &
+ I Test (Init) Exec exec clipmenud &
+ I Test (Init) Exec exec xsetroot -solid "#777777" &
#+ I Test (Init) Exec exec xsetroot -solid "#bfbfbf" &


DestroyFunc RaiseMoveX
AddToFunc RaiseMoveX
+ I Raise
+ M $0
+ D $1

DestroyFunc RaiseMove
AddToFunc RaiseMove
+ I Raise
+ M $0

DestroyFunc MoveToCurrent
AddToFunc MoveToCurrent
+ I ThisWindow MoveToPage
+ I ThisWindow MoveToDesk

DestroyFunc ViewManPage
AddToFunc   ViewManPage
+ I Exec exec $[infostore.terminal] -g 80x40 \
  -n "Manual Page - $0" -T "Manual Page - $0" -e man "$0"

DestroyFunc SetBG
AddToFunc   SetBG
+ I Test (f $[FVWM_USERDIR]/images/background/$0) \
    Exec exec fvwm-root $[FVWM_USERDIR]/images/background/$0
+ I TestRc (Match) Exec exec ln -fs images/background/$0 \
    $[FVWM_USERDIR]/.BGdefault
+ I TestRc (Match) Break
+ I Test (!f $[FVWM_DATADIR]/default-config/images/background/$0) Break
+ I Exec exec fvwm-root $[FVWM_DATADIR]/default-config/images/background/$0
+ I Exec exec ln -fs $[FVWM_DATADIR]/default-config/images/background/$0 \
    $[FVWM_USERDIR]/.BGdefault

DestroyFunc IconManClick
AddToFunc   IconManClick
+ I ThisWindow (Raised, !Shaded, !Iconic, CurrentPage, AnyScreen) Iconify
+ I TestRc (Match) Break
+ I ThisWindow WindowShade off
+ I ThisWindow Iconify off
+ I ThisWindow Raise
+ I ThisWindow (AcceptsFocus) FlipFocus

DestroyFunc ToggleTitle
AddToFunc   ToggleTitle
+ I ThisWindow (HasTitle) WindowStyle !Title
+ I TestRc (NoMatch) WindowStyle Title

DestroyFunc ChangeDesk
AddToFunc   ChangeDesk
+ I SendToModule FvwmButtons ChangeButton desk0 Colorset 10
+ I SendToModule FvwmButtons ChangeButton desk1 Colorset 10
+ I SendToModule FvwmButtons ChangeButton desk2 Colorset 10
+ I SendToModule FvwmButtons ChangeButton desk3 Colorset 10
+ I SendToModule FvwmButtons ChangeButton desk$0 Colorset 11


#############
# 2: Styles #
#############

DesktopName 0 Main
DesktopName 1 Desk1
DesktopName 2 Desk2
DesktopName 3 Desk3
DesktopName 4 Desk4

DesktopSize 2x2
EdgeResistance 0
EdgeScroll 0 0
EdgeThickness 1
Style * EdgeMoveDelay 350, EdgeMoveResistance 350

# Remove traditional title bar globally
Style * !Title

# NOTE: Removed EwmhBaseStruts (no sidebar reserved space)

ClickTime 250
MoveThreshold 3

Style * SloppyFocus, MouseFocusClickRaises

DefaultFont "xft:DejaVu Sans Mono:Bold:size=10:antialias=True"

Style * MinOverlapPlacement, GrabFocusOff, !UsePPosition

Style * !MoveOpaque
Style * !ResizeOpaque, SnapAttraction 15 SameType ScreenAll, SnapGrid

Style * DecorateTransient, StackTransientParent
Style * !FPGrabFocusTransient, FPReleaseFocusTransient

Style * WindowShadeScrolls, WindowShadeSteps 10

IgnoreModifiers L25

Style * Colorset 1, HilightColorset 2

Style * BorderColorset 3
Style * HilightBorderColorset 3
Style * BorderWidth 3, HandleWidth 0, !FvwmBorder, !FirmBorder

# Disable icons from appearing on desktop.
Style * !Icon
Style * MiniIcon none
Style * !Handles

# Window Specific Styles
Style ConfirmQuit !Title, PositionPlacement Center, WindowListSkip, Layer 6
Style FvwmIdent WindowListSkip

# --- Sticky tool windows (no sidebar) ---
Style IconManDock !Title, !Borders, !Handles, Sticky, WindowListSkip, NeverFocus, Layer 6
Style PagerDock   !Title, !Borders, !Handles, Sticky, WindowListSkip, NeverFocus, Layer 6
Style xclock      !Title, !Borders, !Handles, Sticky, WindowListSkip, NeverFocus, Layer 6


###########
# 3: Colorsets - Doric Beach (Plan 9 / Doric inspired)
###########

# Doric Beach palette:
# Sand bg      #f3efe6
# Sand alt     #e8e1d3
# Text         #2e3a3a
# Text dim     #566262
# Sea accent   #2a8f8a
# Sea dark     #1f6f6b
# Sun highlight#d7b46a
# Border       #cfc6b6

Colorset 0  fg #2e3a3a, bg #f3efe6, hi #e8e1d3, sh #e8e1d3, Plain, NoShape
Colorset 1  fg #2e3a3a, bg #f3efe6, hi #e8e1d3, sh #e8e1d3, Plain, NoShape
Colorset 2  fg #f3efe6, bg #2a8f8a, hi #1f6f6b, sh #1f6f6b, Plain, NoShape
Colorset 3  fg #cfc6b6, bg #cfc6b6, hi #cfc6b6, sh #cfc6b6, Plain, NoShape
Colorset 4  fg #2a8f8a, bg #2a8f8a, hi #2a8f8a, sh #2a8f8a, Plain, NoShape

Colorset 5  fg #2e3a3a, bg #f3efe6, hi #e8e1d3, sh #e8e1d3, Plain, NoShape
Colorset 6  fg #f3efe6, bg #2a8f8a, hi #1f6f6b, sh #1f6f6b, Plain, NoShape
Colorset 7  fg #566262, bg #f3efe6, hi #e8e1d3, sh #e8e1d3, Plain, NoShape
Colorset 8  fg #f3efe6, bg #1f6f6b, hi #2a8f8a, sh #2a8f8a, Plain, NoShape

Colorset 10 fg #2e3a3a, bg #f3efe6, hi #e8e1d3, sh #e8e1d3, Plain, NoShape
Colorset 11 fg #f3efe6, bg #2a8f8a, hi #1f6f6b, sh #1f6f6b, Plain, NoShape
Colorset 12 fg #2e3a3a, bg #d7b46a, hi #d7b46a, sh #d7b46a, Plain, NoShape
Colorset 13 fg #f3efe6, bg #1f6f6b, hi #2a8f8a, sh #2a8f8a, Plain, NoShape
Colorset 14 fg #566262, bg #e8e1d3, hi #f3efe6, sh #cfc6b6, Plain, NoShape


#######
# 4: Menus
###########
MenuStyle * MenuColorset 5, ActiveColorset 6, GreyedColorset 7, TitleColorset 8
MenuStyle * Hilight3DOff, HilightBack, HilightTitleBack, SeparatorsLong
MenuStyle * TrianglesSolid, TrianglesUseFore
MenuStyle * ItemFormat "%s%|%3.1i%5.3l%5l%5r%5.3>%|"
MenuStyle * Font "xft:DejaVu Sans Mono:Bold:size=10:antialias=True"
MenuStyle * IconsOff


DestroyMenu MenuFvwmRoot
AddToMenu   MenuFvwmRoot "Fvwm" Title
+ "$[gt.&Programs]%icons/programs.png%" Popup MenuPrograms
+ "$[gt.XDG &Menu]%icons/apps.png%"     Popup XDGMenu
+ "&Vterm%icons/terminal.png%"          Exec exec $[infostore.terminal]
Test (x $[infostore.runcmd]) + "R&un Command%icons/run_arrow.png%" Exec exec $[infostore.runcmd] $[infostore.runcmdopt]
+ "" Nop
Test (x $[FVWM_MODULEDIR]/FvwmConsole) + "Fvwm&Console%icons/terminal.png%" Module FvwmConsole -terminal $[infostore.terminal]
Test (x FvwmPrompt) + "&FvwmPrompt%icons/terminal.png%" Exec exec $[infostore.terminal] -e FvwmPrompt
+ "$[gt.&Wallpapers]%icons/wallpaper.png%" Popup BGMenu
+ "$[gt.M&an Pages]%icons/help.png%"       Popup MenuFvwmManPages
+ "$[gt.Cop&y Config]%icons/conf.png%"     FvwmScript FvwmScript-ConfirmCopyConfig
+ "" Nop
+ "$[gt.Re&fresh]%icons/refresh.png%" Refresh
+ "$[gt.&Restart]%icons/restart.png%" Restart
+ "$[gt.&Quit]%icons/quit.png%"       Module FvwmScript FvwmScript-ConfirmQuit

PipeRead "fvwm-menu-desktop -e"

DestroyMenu MenuPrograms
AddToMenu   MenuPrograms "$[gt.Programs]" Title
Test (x chromium) + "Chromium" Exec exec chromium
Test (x firefox) + "Firefox" Exec exec firefox
Test (x brave) + "Brave" Exec exec brave
Test (x discord) + "Discord" Exec exec brave --app=https://discord.com
Test (x slack) + "Slack" Exec exec slack
Test (x files) + "Files" Exec exec pcmanfm
Test (x google-chrome) + "Google-Chrome" Exec exec google-chrome
Test (x gvim) + "gVim" Exec exec gvim
Test (x emacs) + "Emacs" Exec exec emacs
Test (x emacsclient) + "Emacs[Client]" Exec exec emacsclient -c
Test (x datagrip) + "Datagrip" Exec exec datagrip
Test (x gimp) + "Gimp" Exec exec gimp
Test (x vlc) + "VLC" Exec exec vlc

DestroyMenu BGMenu
AddToMenu   BGMenu "$[gt.Wallpapers]" Title
+ "$[gt.Floral]%bgicons/bg1.png%"  SetBG bg1.png
+ "$[gt.Circles]%bgicons/bg2.png%" SetBG bg2.png
+ "$[gt.Space]%bgicons/bg3.png%"   SetBG bg3.png

DestroyMenu MenuWindowOps
AddToMenu   MenuWindowOps
+ "$[gt.Move]"         Move
+ "$[gt.Resize]"       Resize
+ "$[gt.(De)Iconify]"  Iconify
+ "$[gt.(Un)Maximize]" Maximize
+ "$[gt.(Un)Shade]"    WindowShade
+ "$[gt.(Un)Stick]"    Stick
+ "" Nop
+ "$[gt.Close]"   Close
+ "$[gt.More]..." Menu MenuWindowOpsLong This 0 0

DestroyMenu MenuWindowOpsLong
AddToMenu   MenuWindowOpsLong "$[gt.Window Ops]" Title
+ "$[gt.Move]%icons/win/move.png%"           Move
+ "$[gt.Resize]%icons/win/resize.png%"       Resize
+ "$[gt.(De)Iconify]%icons/win/iconify.png%" Iconify
+ "$[gt.(Un)Maximize]%icons/win/max.png%"    Maximize
+ "$[gt.(Un)Shade]%icons/win/shade.png%"     WindowShade
+ "$[gt.(Un)Sticky]%icons/win/sticky.png%"   Stick
+ "$[gt.(No)Title Bar]%icons/win/title.png%" Pick (CirculateHit) ToggleTitle
+ "$[gt.Send To]%icons/win/sendto.png%"      Popup MenuSendTo
+ "" Nop
+ "$[gt.Close]%icons/win/close.png%"     Close
+ "$[gt.Destroy]%icons/win/destroy.png%" Destroy
+ "" Nop
+ "$[gt.Raise]%icons/win/raise.png%" Raise
+ "$[gt.Lower]%icons/win/lower.png%" Lower
+ "" Nop
+ "$[gt.Stays On Top]%icons/win/top.png%"       Pick (CirculateHit) Layer 0 6
+ "$[gt.Stays Put]%icons/win/stays.png%"        Pick (CirculateHit) Layer 0 4
+ "$[gt.Stays On Bottom]%icons/win/bottom.png%" Pick (CirculateHit) Layer 0 2
+ "" Nop
+ "$[gt.Identify]%icons/info.png%" Module FvwmIdent

DestroyMenu MenuIconOps
AddToMenu   MenuIconOps
+ "$[gt.(De)Iconify]%icons/win/iconify.png%" Iconify
+ "$[gt.(Un)Maximize]%icons/win/max.png%"    Maximize
+ "$[gt.(Un)Shade]%icons/win/shade.png%"     WindowShade
+ "$[gt.(Un)Sticky]%icons/win/sticky.png%"   Stick
+ "$[gt.(No)TitleBar]%icons/win/title.png%"  Pick (CirculateHit) ToggleTitle
+ "$[gt.Send To]%icons/win/sendto.png%"      Popup MenuSendTo
+ "" Nop
+ "$[gt.Close]%icons/win/close.png%"     Close
+ "$[gt.Destroy]%icons/win/destroy.png%" Destroy
+ "" Nop
+ "$[gt.Raise]%icons/win/raise.png%" Raise
+ "$[gt.Lower]%icons/win/lower.png%" Lower
+ "" Nop
+ "$[gt.Stays On Top]%icons/win/top.png%"       Pick (CirculateHit) Layer 0 6
+ "$[gt.Stays Put]%icons/win/stays.png%"        Pick (CirculateHit) Layer 0 4
+ "$[gt.Stays On Bottom]%icons/win/bottom.png%" Pick (CirculateHit) Layer 0 2
+ "" Nop
+ "$[gt.Identify]%icons/info.png%" Module FvwmIdent

DestroyMenu MenuSendTo
AddToMenu MenuSendTo
+ "$[gt.Current]" MoveToCurrent
+ "$[gt.Page]"    PopUp MenuSendToPage
+ "$[gt.Desk]"    PopUp MenuSendToDesk

DestroyMenu MenuSendToDesk
AddToMenu   MenuSendToDesk
+ "$[gt.Desk] 0" MoveToDesk 0 0
+ "$[gt.Desk] 1" MoveToDesk 0 1
+ "$[gt.Desk] 2" MoveToDesk 0 2
+ "$[gt.Desk] 3" MoveToDesk 0 3

DestroyMenu MenuSendToPage
AddToMenu   MenuSendToPage
+ "$[gt.Page] (0,0)" MoveToPage 0 0
+ "$[gt.Page] (0,1)" MoveToPage 0 1
+ "$[gt.Page] (1,0)" MoveToPage 1 0
+ "$[gt.Page] (1,1)" MoveToPage 1 1

DestroyMenu MenuFvwmManPages
AddToMenu   MenuFvwmManPages "Help" Title
+ "fvwm3"         ViewManPage fvwm3
+ "fvwm3commands" ViewManPage fvwm3commands
+ "fvwm3styles"   ViewManPage fvwm3styles
+ "fvwm3menus"    ViewManPage fvwm3menus
+ "fvwm3all"      ViewManPage fvwm3all
+ "" Nop
+ "FvwmAnimate"   ViewManPage FvwmAnimate
+ "FvwmAuto"      ViewManPage FvwmAuto
+ "FvwmBacker"    ViewManPage FvwmBacker
+ "FvwmButtons"   ViewManPage FvwmButtons
+ "FvwmCommand"   ViewManPage FvwmCommand
Test (x $[FVWM_MODULEDIR]/FvwmConsole) + "FvwmConsole" ViewManPage FvwmConsole
+ "FvwmEvent"     ViewManPage FvwmEvent
+ "FvwmIconMan"   ViewManPage FvwmIconMan
+ "FvwmIdent"     ViewManPage FvwmIdent
+ "FvwmPager"     ViewManPage FvwmPager
+ "FvwmPerl"      ViewManPage FvwmPerl
Test (x FvwmPrompt) + "FvwmPrompt" ViewManPage FvwmPrompt
+ "FvwmRearrange" ViewManPage FvwmRearrange
+ "FvwmScript"    ViewManPage FvwmScript
+ "" Nop
+ "fvwm-root"           ViewManPage fvwm-root
+ "fvwm-menu-desktop"   ViewManPage fvwm-menu-desktop
+ "fvwm-menu-directory" ViewManPage fvwm-menu-directory
+ "fvwm-menu-xlock"     ViewManPage fvwm-menu-xlock


#######
# 5: Mouse and Key bindings
####################

Silent Key F1      A M Menu MenuFvwmRoot
Silent Key Menu    A A Menu MenuFvwmRoot

Silent Key Tab A 4 WindowList Root 0 0 \
    NoIcons, NoDeskSort, SelectOnRelease Meta_L, CurrentAtEnd

# Desktop navigation (Super + number)
Silent Key 1 A 4 GotoDesk 0 0
Silent Key 2 A 4 GotoDesk 0 1
Silent Key 3 A 4 GotoDesk 0 2
Silent Key 4 A 4 GotoDesk 0 3
Silent Key 5 A 4 GotoDesk 0 4

# Move window to desktop (Super + Shift + number)
Silent Key 1 A 4S MoveToDesk 0 0
Silent Key 2 A 4S MoveToDesk 0 1
Silent Key 3 A 4S MoveToDesk 0 2
Silent Key 4 A 4S MoveToDesk 0 3
Silent Key 5 A 4S MoveToDesk 0 4

Silent Key space A 4S Maximize 100 100
Silent Key q     A 4 Close
Silent Key f     A 4S Maximize
Silent Key r     A 4S Raise
Silent Key m     A 4S Lower

# Emacs-style page navigation (Super + Ctrl + key)
Silent Key 2 A 4C GotoPage 0 1
Silent Key 1 A 4C GotoPage 0 0
Silent Key 3 A 4C GotoPage 1 0
Silent Key 4 A 4C GotoPage 1 1

# Move window between pages (Super + Shift + Ctrl + key)
Silent Key 2 A 4CS MoveToPage 0 1
Silent Key 1 A 4CS MoveToPage 0 0
Silent Key 3 A 4CS MoveToPage 1 0
Silent Key 4 A 4CS MoveToPage 1 1

# Emacs-style window movement by 10% (Super + Alt + f/b/n/p)
Silent Key f WTSF 4M AnimatedMove w+25p keep
Silent Key b WTSF 4M AnimatedMove w-25p keep
Silent Key n WTSF 4M AnimatedMove keep w+25p
Silent Key p WTSF 4M AnimatedMove keep w-25p

# Emacs-style window resizing by 25% (Super + Ctrl + Alt + f/b/n/p)
Silent Key f WTSF 4CM Resize w+25p keep
Silent Key b WTSF 4CM Resize w-25p keep
Silent Key n WTSF 4CM Resize keep w+25p
Silent Key p WTSF 4CM Resize keep w-25p

Silent Key Return  A 4 Exec exec $[infostore.terminal]
Test (x $[infostore.runcmd]) Silent Key Space A 4 Exec exec $[infostore.runcmd] $[infostore.runcmdopt]

Silent Key e A 4 Exec exec emacsclient -c
Silent Key b A 4S Exec exec battery.clj -n
Silent Key l A 4S Exec exec xsecurelock


# Window Buttons
Mouse 1 1 A Menu MenuWindowOps Delete
Mouse 1 2 A Close
Mouse 1 2 A Destroy

# Super + Mouse bindings - move and resize anywhere in window
Mouse 1 W 4 Move
Mouse 3 W 4 Resize

Mouse 1 T    A RaiseMoveX Move Maximize
Mouse 1 FS   A RaiseMove Resize
Mouse 4 T    A WindowShade True
Mouse 5 T    A WindowShade False
Mouse 1 R    A Menu MenuFvwmRoot
Mouse 2 R    A WindowList
Mouse 3 R    A Menu MenuWindowOpsLong
Mouse 1 I    A RaiseMoveX Move "Iconify off"
Mouse 3 T    A Menu MenuWindowOps
Mouse 3 I    A Menu MenuIconOps


DestroyFunc ShuffleDir
AddToFunc   ShuffleDir
+ I Move shuffle layers $[w.layer] $[w.layer] snap windows $0
+ I WarpToWindow 50 50

Key Up      WTSF    CM  ShuffleDir up
Key Down    WTSF    CM  ShuffleDir down
Key Left    WTSF    CM  ShuffleDir left
Key Right   WTSF    CM  ShuffleDir right
Key Up      WTSF    CSM Maximize True 0 growup
Key Down    WTSF    CSM Maximize True 0 growdown
Key Right   WTSF    CSM Maximize True growright 0
Key Left    WTSF    CSM Maximize True growleft 0


#######
